name: publish

on:
  release:
    types: [published]
  # A publish that failed (npm outage, a trusted-publisher setting fixed after
  # the release) is re-run from here: re-running the old workflow run reuses the
  # YAML of its own commit, which is the one you just fixed away from.
  workflow_dispatch:

permissions:
  # OIDC: npm trusts this workflow by name instead of a long-lived token, so
  # there is no publish secret to leak or rotate (ADR-0023).
  id-token: write
  contents: read

jobs:
  npm:
    name: npm publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          # No `registry-url` on purpose: setup-node would write an .npmrc whose
          # `_authToken` is the empty NODE_AUTH_TOKEN, and a request carrying an
          # empty token is answered 404 instead of being authenticated by OIDC
          # (first v1.0.8 attempt after switching died exactly there). npm's
          # default registry is already registry.npmjs.org.

      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run build

      # verify.yml gates every push/PR with the full suite. This job adds the
      # release-specific gate: the tarball must actually carry the source, the
      # skill and the compiled output that package.json points pi at.
      - name: Verify the release tarball
        run: |
          npm pack --dry-run --json --ignore-scripts > pack.json
          files="src/index.ts skills/pretty-task-templates/SKILL.md"
          files="$files dist/index.js"
          pick='any(.[0].files[].path; . == $f)'
          for f in $files; do
            jq -e --arg f "$f" "$pick" pack.json > /dev/null \
              || { echo "::error::$f is missing from the tarball"; exit 1; }
          done
          echo "tarball OK: $(jq '.[0].entryCount' pack.json) files"
          rm pack.json

      - name: Release tag must match package.json
        # Only a release event has a tag to compare against.
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${RELEASE_TAG#v}" != "$version" ]; then
            echo "::error::tag $RELEASE_TAG != package.json version"
            echo "::error::expected tag v$version"
            exit 1
          fi
          echo "Publishing $version from $RELEASE_TAG"

      # Trusted publishing is npm's OIDC exchange; it needs npm 11.5.1 or
      # later, which the runner image owns, not this repository.
      - name: Check the npm CLI can exchange an OIDC token
        run: |
          node --version
          have="$(npm --version)"
          need="11.5.1"
          echo "npm $have"
          lowest="$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)"
          if [ "$lowest" != "$need" ]; then
            echo "::error::npm $have is older than $need"
            echo "::error::trusted publishing needs 11.5.1 or later"
            exit 1
          fi

      # npm's OIDC exchange never throws: a missing permission or a failed
      # exchange just leaves it without credentials and the publish dies with
      # ENEEDAUTH. Print what the runner actually saw.
      - name: Show the OIDC environment
        run: |
          echo "id-token-url: ${ACTIONS_ID_TOKEN_REQUEST_URL:+present}"
          echo "id-token-request: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+present}"
          echo "npm-id-token: ${NPM_ID_TOKEN:+present}"

      # No NODE_AUTH_TOKEN: the CLI finds the OIDC environment and exchanges
      # it for a short-lived registry token, adding provenance itself.
      - name: Publish
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            npm publish --tag next
          else
            npm publish
          fi

      - name: Explain a publish failure
        if: failure()
        run: |
          for f in "$HOME"/.npm/_logs/*-debug-0.log; do
            echo "--- $f"
            grep -iE "oidc|id.token|trusted|auth" "$f" | tail -25
          done

      # A publish that npm accepts is not yet a version a consumer can install:
      # a held version sits behind a `0.0.0-stage` placeholder, and a staged
      # publish waits for a maintainer's approval. Poll so a wait shows up as a
      # warning instead of a package that silently never appears.
      - name: Confirm the version reached the registry
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          url="https://registry.npmjs.org/$name/$version"
          code=""
          for i in $(seq 1 20); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$url")"
            if [ "$code" = "200" ]; then
              echo "$url is live"
              exit 0
            fi
            echo "attempt $i: HTTP $code, waiting 15s"
            sleep 15
          done
          echo "::warning::$version is accepted but not visible yet"
          echo "::warning::HTTP $code - a hold sits behind 0.0.0-stage"
          echo "::warning::recheck https://www.npmjs.com/package/$name later"
